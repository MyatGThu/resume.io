# Deploy the static portfolio to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        # Publish only what the page loads. Development files (PRODUCT.md,
        # .impeccable/, .claude/, README) stay in the repository, off the web.
        # The commit SHA stamps the asset query strings as a cache-bust.
        run: |
          mkdir _site
          cp -r index.html styles.css main.js assets _site/
          sed -i "s/__BUILD__/${GITHUB_SHA}/g" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
